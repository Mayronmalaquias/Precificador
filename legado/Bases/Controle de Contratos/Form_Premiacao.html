<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Vendas por Gerente e Intervalo de Datas</title>
    <style>
        body {
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .form {
            background-color: #15172b;
            border-radius: 20px;
            box-sizing: border-box;
            padding: 20px;
            width: 85%;
            max-height: 90%;
            overflow-y: auto;
        }
        .title {
            color: #eee;
            font-family: sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-top: 30px;
            text-align: center;
        }
        .input-container {
            height: 50px;
            position: relative;
            width: 100%;
            margin-top: 20px;
        }
        .input {
            background-color: #303245;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            font-size: 16px;
            height: 100%;
            outline: 0;
            padding: 4px 20px 0;
            width: 100%;
        }
        .cut {
            background-color: #15172b;
            border-radius: 10px;
            height: 20px;
            left: 20px;
            position: absolute;
            top: -20px;
            transform: translateY(0);
            transition: transform 200ms;
            width: 170px;
        }
        .cut-short {
            width: 70px;
        }
        .input:focus ~ .cut,
        .input:not(:placeholder-shown) ~ .cut {
            transform: translateY(8px);
        }
        .placeholder {
            color: #65657b;
            font-family: sans-serif;
            left: 20px;
            line-height: 14px;
            pointer-events: none;
            position: absolute;
            transform-origin: 0 50%;
            transition: transform 200ms, color 200ms;
            top: 20px;
        }
        .input:focus ~ .placeholder,
        .input:not(:placeholder-shown) ~ .placeholder {
            transform: translateY(-30px) translateX(10px) scale(0.75);
        }
        .input:not(:placeholder-shown) ~ .placeholder {
            color: #808097;
        }
        .input:focus ~ .placeholder {
            color: #dc2f55;
        }
        .submit {
            background-color: #08d;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            cursor: pointer;
            font-size: 18px;
            height: 50px;
            margin-top: 38px;
            text-align: center;
            width: 100%;
        }
        .submit:active {
            background-color: #06b;
        }
        h2 {
            color: #eee;
            font-family: sans-serif;
            font-size: 24px;
            margin-top: 20px;
            text-align: center;
            font-style: italic;
        }
        .linha {
            border-bottom: 2px solid #eee;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px; /* Fonte reduzida */
        }
        th, td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: center;
            color: #eee;
        }
        th {
            background-color: #303245;
        }
        td {
            background-color: #15172b;
        }
        /* Estilo para os totais */
        .total-info {
            color: #fff; /* Fonte branca */
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <form id="filtroForm" class="form">
        <div class="title">Filtro de Vendas</div>
        
        <h2>Dados do Gerente e Intervalo de Datas</h2>
        <hr>

        <!-- Dropdown de Gerentes -->
        <div class="input-container">
            <select id="gerente" name="gerente" class="input" required>
                <option value="">Selecione o Gerente</option>
            </select>
            <div class="cut"></div>
            <label for="gerente" class="placeholder">Gerente</label>
        </div>

        <!-- Campo de Data Inicial -->
        <div class="input-container">
            <input type="date" id="startDate" name="startDate" class="input" placeholder=" " required>
            <div class="cut"></div>
            <label for="startDate" class="placeholder">Data Inicial</label>
        </div>

        <!-- Campo de Data Final -->
        <div class="input-container">
            <input type="date" id="endDate" name="endDate" class="input" placeholder=" " required>
            <div class="cut"></div>
            <label for="endDate" class="placeholder">Data Final</label>
        </div>

        <button type="button" class="submit" onclick="filtrarVendas()">Filtrar Vendas</button>

        <div class="total-info">
            <p>Comissão Gerente no período : <span id="totalPeriodo">R$ 0,00</span></p>
            <p>Comissão Empresa no período : <span id="totalEmpresaPeriodo">R$ 0,00</span></p>
            <p>Participação do Gerente no período: <span id="participacaoPeriodo">0%</span></p>
            <p>Comissão Gerente no ano: <span id="totalAno">R$ 0,00</span></p>
            <p>Comissão Empresa no ano: <span id="totalEmpresaAno">R$ 0,00</span></p>
            <p>Participação do Gerente no ano: <span id="participacaoAno">0%</span></p>
        </div>


        <!-- Botão de Enviar Atualizações -->
        <button type="button" class="submit" onclick="enviarAtualizacoes()">Enviar Atualizações</button>

        <div id="resultados" style="margin-top: 20px;"></div>
    </form>

    <script>
        // Mapeamento de gerentes para suas respectivas colunas
        const colunaMap = {
            'José Marques': 135,
            'Marcelo Souza': 136,
            'Luana Salvinski': 137,
            'Thais Tannús': 138
        };

        // Função para enviar as atualizações em massa
        function enviarAtualizacoes() {
            const gerente = document.getElementById('gerente').value;
            const percentualColIndex = colunaMap[gerente];

            if (!percentualColIndex) {
                alert('Gerente não selecionado ou coluna não mapeada.');
                return;
            }

            const inputsPercentual = document.querySelectorAll('input[type="text"]');
            let updatesPromises = [];
            
            inputsPercentual.forEach(input => {
                const idContrato = input.getAttribute('data-idcontrato');
                const percentual = input.value;
                
                // Adiciona cada atualização como uma promise
                updatesPromises.push(
                    new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(function() {
                                console.log(`Atualização do contrato ${idContrato} na coluna ${percentualColIndex} enviada com sucesso!`);
                                resolve(); // Sucesso
                            })
                            .withFailureHandler(function(error) {
                                console.error(`Erro ao atualizar o contrato ${idContrato}: ${error.message}`);
                                reject(error); // Falha
                            })
                            .atualizarPercentual(percentual, idContrato, percentualColIndex);
                    })
                );
            });

            // Processa todas as atualizações de uma vez
            Promise.all(updatesPromises)
                .then(() => {
                    alert('Todas as atualizações foram enviadas com sucesso!');
                    // Chama a função de premiação após o sucesso de todas as atualizações
                    rodarFuncoesPremiacao();
                })
                .catch(() => {
                    alert('Algumas atualizações falharam. Verifique os erros no console.');
                });
        }

        // Função para popular o dropdown de Gerentes
        function popularDropdownGerente() {
            google.script.run.withSuccessHandler(function(data) {
                const selectGerente = document.getElementById('gerente');
                data.gerentes.forEach(function(gerente) {
                    const option = document.createElement('option');
                    option.value = gerente.nome;
                    option.text = gerente.nome;
                    selectGerente.add(option);
                });
            }).getDropdownGerente();
        }

        // Chamar a função para popular o dropdown quando o formulário carregar
        document.addEventListener('DOMContentLoaded', function() {
            popularDropdownGerente();
        });

        // Função para validar datas e filtrar as vendas
        function filtrarVendas() {
            const gerente = document.getElementById('gerente').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            // Modificar a lógica para incluir a data final (adicionar um dia à data final)
            const startDateObj = new Date(startDate);
            const endDateObj = new Date(endDate);
            
            // Ajusta a data final para incluir o dia completo
            endDateObj.setDate(endDateObj.getDate() + 1);

            // Verifica se a data final é anterior à inicial
            if (startDateObj > endDateObj) {
                alert('A data final não pode ser anterior à data inicial.');
                return;
            }

            google.script.run.withSuccessHandler(function(data) {
                document.getElementById('resultados').innerHTML = data.htmlTable;
                document.getElementById('totalPeriodo').innerHTML = data.totalPeriodo;
                document.getElementById('totalEmpresaPeriodo').innerHTML = data.totalEmpresaPeriodo;
                document.getElementById('totalAno').innerHTML = data.totalAno;
                document.getElementById('totalEmpresaAno').innerHTML = data.totalEmpresaAno;
                document.getElementById('participacaoPeriodo').innerHTML = data.participacaoPeriodo;
                document.getElementById('participacaoAno').innerHTML = data.participacaoAno;
            }).filtrarVendasGerente(gerente, startDate, endDateObj.toISOString().split('T')[0]);
        }

        // Função para atualizar o percentual de premiação
        function atualizarPercentual(input, idContrato) {
            google.script.run
                .withSuccessHandler(function() {
                    console.log(`Percentual do contrato ${idContrato} atualizado com sucesso!`);
                    // Chama a função para rodar após o sucesso da atualização
                    rodarFuncoesPremiacao();
                })
                .withFailureHandler(function(error) {
                    console.error(`Erro ao atualizar o contrato ${idContrato}: ${error.message}`);
                })
                .atualizarPercentual(input.value, idContrato);
        }

        // Função separada para rodar funções de premiação após a atualização
        function rodarFuncoesPremiacao() {
            setTimeout(function() {
                google.script.run.runFilterAndTransferPremiacao(); // Primeira função sem passar valores
                google.script.run.runFilterAndTransferPremiacaoMar();
                google.script.run.runFilterAndTransferPremiacaoLu(); // Outra função sem passar valores
                google.script.run.runFilterAndTransferPremiacaoThais(); // Outra função sem passar valores
            }, 2000); // Delay de 2 segundos
        }
    </script>

  </body>
</html>
