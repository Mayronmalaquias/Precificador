<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; }
      input[type="file"] { width: 100%; }
      button {
        background-color: #4285F4;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      button:disabled {
        background-color: #c0c0c0;
        cursor: not-allowed;
      }
      #status {
        margin-top: 15px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h3>Importar Bases de Dados</h3>
    <p>Selecione os 3 arquivos .csv para consolidar as informações.</p>
    
    <div class="form-group">
      <label for="olxZapFile">1. Base OLX/ZAP/VivaReal (.csv)</label>
      <input type="file" id="olxZapFile" accept=".csv">
    </div>

    <div class="form-group">
      <label for="c2sFile">2. Base de Leads (C2S) (.csv)</label>
      <input type="file" id="c2sFile" accept=".csv">
    </div>

    <div class="form-group">
      <label for="dfimoveisFile">3. Base DFimoveis (.csv)</label>
      <input type="file" id="dfimoveisFile" accept=".csv">
    </div>

    <button id="submitBtn" onclick="processFiles()">Processar Arquivos</button>

    <div id="status"></div>

    <script>
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');

      function processFiles() {
        const olxZapInput = document.getElementById('olxZapFile');
        const c2sInput = document.getElementById('c2sFile');
        const dfimoveisInput = document.getElementById('dfimoveisFile');

        if (olxZapInput.files.length === 0 || c2sInput.files.length === 0 || dfimoveisInput.files.length === 0) {
          statusDiv.innerText = 'Por favor, selecione os 3 arquivos.';
          return;
        }

        submitBtn.disabled = true;
        statusDiv.innerText = 'Processando, por favor aguarde...';

        const filePromises = [
          readFileAsText(olxZapInput.files[0]),
          readFileAsText(c2sInput.files[0]),
          readFileAsText(dfimoveisInput.files[0])
        ];

        Promise.all(filePromises)
          .then(filesData => {
            const formObject = {
              olxZapFile: filesData[0],
              c2sFile: filesData[1],
              dfimoveisFile: filesData[2]
            };
            google.script.run
              .withSuccessHandler(onSuccess)
              .withFailureHandler(onFailure)
              .processFiles(formObject);
          })
          .catch(err => {
            onFailure(err);
          });
      }

      // Função alterada para ler como texto
      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = (error) => reject(error);
          reader.readAsText(file); // Lê o arquivo como texto puro
        });
      }

      function onSuccess(message) {
        statusDiv.innerText = message;
        submitBtn.disabled = false;
        // Limpa os campos de arquivo após o sucesso
        document.getElementById('olxZapFile').value = "";
        document.getElementById('c2sFile').value = "";
        document.getElementById('dfimoveisFile').value = "";
      }

      function onFailure(error) {
        statusDiv.innerText = 'Erro: ' + error.message;
        submitBtn.disabled = false;
      }
    </script>
  </body>
</html>
