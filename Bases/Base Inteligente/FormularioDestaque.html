<!DOCTYPE html>
<html>
<head>
    <title>Upload de Arquivos CSV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
    <style>
        body {
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .form {
            background-color: #15172b;
            border-radius: 20px;
            box-sizing: border-box;
            padding: 20px;
            width: 85%; /* Ajuste conforme o design */
            max-height: 90%;
            overflow-y: auto; /* Permitir rolagem caso o conteúdo exceda */
        }
        .title {
            color: #eee;
            font-family: sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-top: 30px;
            text-align: center;
        }
        .input-container {
            height: 50px;
            position: relative;
            width: 100%;
            margin-top: 20px;
        }
        .input {
            background-color: #303245;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            font-size: 18px;
            height: 100%;
            outline: 0;
            padding: 10px 20px;
            width: 100%;
        }
        .input[type="file"] {
            padding: 10px 0;
        }
        .cut {
            background-color: #15172b;
            border-radius: 10px;
            height: 20px;
            left: 20px;
            position: absolute;
            top: -20px;
            transform: translateY(0);
            transition: transform 200ms;
            width: 150px;
        }
        .cut-short {
            width: 70px;
        }
        .input:focus ~ .cut,
        .input:not(:placeholder-shown) ~ .cut {
            transform: translateY(8px);
        }
        .placeholder {
            color: #65657b;
            font-family: sans-serif;
            left: 20px;
            line-height: 14px;
            pointer-events: none;
            position: absolute;
            transform-origin: 0 50%;
            transition: transform 200ms, color 200ms;
            top: 20px;
        }
        .input:focus ~ .placeholder,
        .input:not(:placeholder-shown) ~ .placeholder {
            transform: translateY(-30px) translateX(10px) scale(0.75);
        }
        .input:not(:placeholder-shown) ~ .placeholder {
            color: #808097;
        }
        .input:focus ~ .placeholder {
            color: #dc2f55;
        }
        .submit {
            background-color: #08d;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            cursor: pointer;
            font-size: 18px;
            height: 50px;
            margin-top: 38px;
            text-align: center;
            width: 100%;
        }
        .submit:active {
            background-color: #06b;
        }
    </style>
</head>
<body>

    <form id="uploadForm" class="form">
        <div class="title">Upload de Arquivos XLSX</div>

        <div class="input-container">
            <input type="file" id="seguros" name="seguros" class="input" accept=".xlsx">
            <div class="cut"></div>
            <label for="seguros" class="placeholder">Upload XLSX Seguros</label>
        </div>

        <div class="input-container">
            <input type="file" id="imoveis" name="imoveis" class="input" accept=".xlsx">
            <div class="cut"></div>
            <label for="imoveis" class="placeholder">Upload XLSX Imóveis</label>
        </div>

        <div class="input-container">
            <input type="file" id="assinados" name="assinados" class="input" accept=".xlsx">
            <div class="cut"></div>
            <label for="assinados" class="placeholder">Upload XLSX Assinados</label>
        </div>

        <button type="button" class="submit" onclick="uploadXLSX()">Enviar</button>
    </form>
    
  <script>
    function uploadXLSX() {
      // Obter os arquivos
      var segurosFile = document.getElementById('seguros').files[0];
      var imoveisFile = document.getElementById('imoveis').files[0];
      var assinadosFile = document.getElementById('assinados').files[0];
      
      if (!segurosFile || !imoveisFile || !assinadosFile) {
        alert('Todos os arquivos são obrigatórios.');
        return;
      }

      var reader1 = new FileReader();
      var reader2 = new FileReader();
      var reader3 = new FileReader();

      var segurosContent, imoveisContent, assinadosContent;

      // Função para verificar se todos os arquivos foram lidos e chamar o Google Apps Script
      function checkAndRun() {
        if (segurosContent && imoveisContent && assinadosContent) {
          google.script.run.withSuccessHandler(function(msg) {
            alert(msg);
          }).processXLSXFiles(segurosContent, imoveisContent, assinadosContent);
        }
      }

      // Leitura do arquivo Seguros
      reader1.onload = function(e) {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, { type: 'array' });
        segurosContent = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        checkAndRun();
      };

      // Leitura do arquivo Imóveis
      reader2.onload = function(e) {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, { type: 'array' });
        imoveisContent = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        checkAndRun();
      };

      // Leitura do arquivo Assinados
      reader3.onload = function(e) {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, { type: 'array' });
        assinadosContent = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        checkAndRun();
      };

      // Ler os arquivos como ArrayBuffer
      reader1.readAsArrayBuffer(segurosFile);
      reader2.readAsArrayBuffer(imoveisFile);
      reader3.readAsArrayBuffer(assinadosFile);
    }
  </script>

</body>
</html>
