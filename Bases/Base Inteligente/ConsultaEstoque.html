<!DOCTYPE html>
<html>
<head>
    <title>Consulta ao Fato Estoque</title>
    <style>
        body {
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .form {
            background-color: #15172b;
            border-radius: 20px;
            box-sizing: border-box;
            padding: 20px;
            width: 85%;
            max-height: 90%;
            overflow-y: auto;
        }
        .title {
            color: #eee;
            font-family: sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-top: 30px;
            text-align: center;
        }
        .input-container {
            height: 50px;
            position: relative;
            width: 100%;
            margin-top: 20px;
        }
        .input {
            background-color: #303245;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            font-size: 18px;
            height: 100%;
            outline: 0;
            padding: 4px 20px 0;
            width: 100%;
        }
        .cut {
            background-color: #15172b;
            border-radius: 10px;
            height: 20px;
            left: 20px;
            position: absolute;
            top: -20px;
            transform: translateY(0);
            transition: transform 200ms;
            width: 150px;
        }
        .cut-short {
            width: 70px;
        }
        .input:focus ~ .cut,
        .input:not(:placeholder-shown) ~ .cut {
            transform: translateY(8px);
        }
        .placeholder {
            color: #65657b;
            font-family: sans-serif;
            left: 20px;
            line-height: 14px;
            pointer-events: none;
            position: absolute;
            transform-origin: 0 50%;
            transition: transform 200ms, color 200ms;
            top: 20px;
        }
        .input:focus ~ .placeholder,
        .input:not(:placeholder-shown) ~ .placeholder {
            transform: translateY(-30px) translateX(10px) scale(0.75);
        }
        .input:not(:placeholder-shown) ~ .placeholder {
            color: #808097;
        }
        .input:focus ~ .placeholder {
            color: #dc2f55;
        }
        .submit, .btn-primary {
            background-color: #08d;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            cursor: pointer;
            font-size: 18px;
            height: 50px;
            margin-top: 38px;
            text-align: center;
            width: 100%;
        }
        .submit:active, .btn-primary:active {
            background-color: #06b;
        }
        .btn-primary {
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #06b;
        }
        #resultadoConsulta {
            background-color: #303245;
            border-radius: 12px;
            color: #eee;
            font-size: 20px;
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            width: 98%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>
<body>
    <form id="consultaForm" class="form">
        <div class="title">Consulta ao Estoque</div>
        <div class="input-container">
            <input type="date" id="consultaData" name="consultaData" class="input">
            <div class="cut"></div>
            <label for="consultaData" class="placeholder">Data</label>
        </div>
        <div class="input-container">
            <input type="text" id="consultaCodigo" name="consultaCodigo" class="input">
            <div class="cut"></div>
            <label for="consultaCodigo" class="placeholder">Código</label>
        </div>
        <button type="button" class="submit" onclick="consultarEstoque()">Consultar</button>
        <div id="resultadoConsulta"></div>
        <button type="button" class="btn-primary" onclick="google.script.run.showMainMenu()">Menu Principal</button>
    </form>
    <script>
        function consultarEstoque() {
            const form = document.getElementById('consultaForm');
            const data = form.consultaData.value;
            const codigo = form.consultaCodigo.value;

            google.script.run.withSuccessHandler(exibirResultado).consultarEstoque({ data, codigo });
        }

        function exibirResultado(resultadoJson) {
            const resultado = JSON.parse(resultadoJson);
            const resultadoDiv = document.getElementById('resultadoConsulta');
            resultadoDiv.innerHTML = '';

            if (resultado.totalRegistros !== undefined) {
                const totalRegistrosDiv = document.createElement('div');
                totalRegistrosDiv.textContent = 'Total de registros: ' + resultado.totalRegistros;
                resultadoDiv.appendChild(totalRegistrosDiv);
            }

            if (resultado.registroMaisRecente && Object.keys(resultado.registroMaisRecente).length > 0) {
                const registroMaisRecenteDiv = document.createElement('div');
                registroMaisRecenteDiv.innerHTML = '<h3>Registro Mais Recente</h3>';
                resultadoDiv.appendChild(registroMaisRecenteDiv);

                const table = document.createElement('table');
                const headerRow = table.insertRow();
                Object.keys(resultado.registroMaisRecente).forEach(key => {
                    const th = document.createElement('th');
                    th.textContent = key;
                    headerRow.appendChild(th);
                });

                const tr = table.insertRow();
                Object.values(resultado.registroMaisRecente).forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value;
                    tr.appendChild(td);
                });

                table.appendChild(headerRow);
                table.appendChild(tr);
                resultadoDiv.appendChild(table);
            }
        }
    </script>
</body>
</html>
