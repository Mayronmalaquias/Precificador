<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Vendas por Diretor e Intervalo de Datas</title>
    <style>
        body {
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .form {
            background-color: #15172b;
            border-radius: 20px;
            box-sizing: border-box;
            padding: 20px;
            width: 85%;
            max-height: 90%;
            overflow-y: auto;
        }
        .title {
            color: #eee;
            font-family: sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-top: 30px;
            text-align: center;
        }
        .input-container {
            height: 50px;
            position: relative;
            width: 100%;
            margin-top: 20px;
        }
        .input {
            background-color: #303245;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            font-size: 16px;
            height: 100%;
            outline: 0;
            padding: 4px 20px 0;
            width: 100%;
        }
        .cut {
            background-color: #15172b;
            border-radius: 10px;
            height: 20px;
            left: 20px;
            position: absolute;
            top: -20px;
            transform: translateY(0);
            transition: transform 200ms;
            width: 170px;
        }
        .cut-short {
            width: 70px;
        }
        .input:focus ~ .cut,
        .input:not(:placeholder-shown) ~ .cut {
            transform: translateY(8px);
        }
        .placeholder {
            color: #65657b;
            font-family: sans-serif;
            left: 20px;
            line-height: 14px;
            pointer-events: none;
            position: absolute;
            transform-origin: 0 50%;
            transition: transform 200ms, color 200ms;
            top: 20px;
        }
        .input:focus ~ .placeholder,
        .input:not(:placeholder-shown) ~ .placeholder {
            transform: translateY(-30px) translateX(10px) scale(0.75);
        }
        .input:not(:placeholder-shown) ~ .placeholder {
            color: #808097;
        }
        .input:focus ~ .placeholder {
            color: #dc2f55;
        }
        .submit {
            background-color: #08d;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            cursor: pointer;
            font-size: 18px;
            height: 50px;
            margin-top: 38px;
            text-align: center;
            width: 100%;
        }
        .submit:active {
            background-color: #06b;
        }
        h2 {
            color: #eee;
            font-family: sans-serif;
            font-size: 24px;
            margin-top: 20px;
            text-align: center;
            font-style: italic;
        }
        .linha {
            border-bottom: 2px solid #eee;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: center;
            color: #eee;
        }
        th {
            background-color: #303245;
        }
        td {
            background-color: #15172b;
        }
        .total-info {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <form id="filtroFormDiretor" class="form">
        <div class="title">Filtro de Vendas - Diretor</div>
        
        <h2>Dados do Diretor e Intervalo de Datas</h2>
        <hr>

        <div class="input-container">
            <select id="diretor" name="diretor" class="input" required>
                <option value="">Selecione o Diretor</option>
            </select>
            <div class="cut"></div>
            <label for="diretor" class="placeholder">Diretor</label>
        </div>

        <div class="input-container">
            <input type="date" id="startDateDiretor" name="startDateDiretor" class="input" placeholder=" " required>
            <div class="cut"></div>
            <label for="startDateDiretor" class="placeholder">Data Inicial</label>
        </div>

        <div class="input-container">
            <input type="date" id="endDateDiretor" name="endDateDiretor" class="input" placeholder=" " required>
            <div class="cut"></div>
            <label for="endDateDiretor" class="placeholder">Data Final</label>
        </div>

        <button type="button" class="submit" onclick="filtrarVendasDiretor()">Filtrar Vendas</button>

        <div class="total-info">
            <p>Comissão Diretor no período : <span id="totalPeriodoDiretor">R$ 0,00</span></p>
            <p>Comissão Empresa no período : <span id="totalEmpresaPeriodoDiretor">R$ 0,00</span></p>
            <p>Participação do Diretor no período: <span id="participacaoPeriodoDiretor">0%</span></p>
            <p>Comissão Diretor no ano: <span id="totalAnoDiretor">R$ 0,00</span></p>
            <p>Comissão Empresa no ano: <span id="totalEmpresaAnoDiretor">R$ 0,00</span></p>
            <p>Participação do Diretor no ano: <span id="participacaoAnoDiretor">0%</span></p>
        </div>

        <button type="button" class="submit" onclick="enviarAtualizacoesDiretor()">Enviar Atualizações</button>

        <div id="resultadosDiretor" style="margin-top: 20px;"></div>
    </form>

    <script>
        let linhasContratos = [];
        let linhasModificadas = []; 

        const colunaMapDiretor = {
            'José Marques': 10,
        };

        function enviarAtualizacoesDiretor() {
            const diretor = document.getElementById('diretor').value;
            const percentualColIndex = colunaMapDiretor[diretor];

            if (!percentualColIndex) {
                alert('Diretor não selecionado ou coluna não mapeada.');
                return;
            }

            const inputsPercentual = document.querySelectorAll('input[type="text"]');
            let updatesPromises = [];

            inputsPercentual.forEach(input => {
                const idContrato = input.getAttribute('data-idcontrato');
                let percentual = input.value;

                // Verificar se o percentual foi preenchido
                if (percentual === "") {
                    console.log(`Campo de percentual para o contrato ${idContrato} está vazio, será ignorado.`);
                    return; // Ignora este campo se estiver vazio
                }

                // Verificar se o percentual é um número e ajustar para valor decimal
                if (!isNaN(percentual) && percentual > 0) {
                    percentual = parseFloat(percentual) / 100; // Converte o valor inteiro para percentual
                } else {
                    alert('Insira um valor percentual válido.');
                    return;
                }

                updatesPromises.push(
                    new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(() => {
                                console.log(`Atualização do contrato ${idContrato} na coluna ${percentualColIndex} enviada com sucesso!`);
                                linhasModificadas.push(Number(idContrato)); 
                                resolve();
                            })
                            .withFailureHandler((error) => {
                                console.error(`Erro ao atualizar o contrato ${idContrato}: ${error.message}`);
                                reject();
                            })
                            .atualizarPercentual(percentual, idContrato, percentualColIndex);
                    })
                );
            });

            Promise.all(updatesPromises).then(() => {
                alert('Todas as atualizações foram enviadas com sucesso!');

                setTimeout(() => {
                    google.script.run.calculateCommissionsDiretor();
                }, 2000);

                linhasModificadas = [];
            }).catch(() => {
                alert('Algumas atualizações falharam. Verifique os erros no console.');
            });
        }

        function popularDropdownDiretor() {
            google.script.run.withSuccessHandler(function (data) {
                const selectDiretor = document.getElementById('diretor');
                data.diretores.forEach(function (diretor) {
                    const option = document.createElement('option');
                    option.value = diretor.nome;
                    option.text = diretor.nome;
                    selectDiretor.add(option);
                });
            }).getDropdownDiretor();
        }

        document.addEventListener('DOMContentLoaded', function () {
            popularDropdownDiretor();
        });

        function filtrarVendasDiretor() {
            const diretor = document.getElementById('diretor').value;
            const startDate = document.getElementById('startDateDiretor').value;
            const endDate = document.getElementById('endDateDiretor').value;

            const startDateObj = new Date(startDate);
            const endDateObj = new Date(endDate);
            endDateObj.setDate(endDateObj.getDate() + 1);

            if (startDateObj > endDateObj) {
                alert('A data final não pode ser anterior à data inicial.');
                return;
            }

            google.script.run.withSuccessHandler(function (data) {
                document.getElementById('resultadosDiretor').innerHTML = data.htmlTable;
                document.getElementById('totalPeriodoDiretor').innerHTML = data.totalPeriodo;
                document.getElementById('totalEmpresaPeriodoDiretor').innerHTML = data.totalEmpresaPeriodo;
                document.getElementById('totalAnoDiretor').innerHTML = data.totalAno;
                document.getElementById('totalEmpresaAnoDiretor').innerHTML = data.totalEmpresaAno;
                document.getElementById('participacaoPeriodoDiretor').innerHTML = data.participacaoPeriodo;
                document.getElementById('participacaoAnoDiretor').innerHTML = data.participacaoAno;

                linhasContratos = data.linhasContratos;
            }).filtrarVendasDiretor(diretor, startDate, endDateObj.toISOString().split('T')[0]);
        }
    </script>

</body>
</html>
