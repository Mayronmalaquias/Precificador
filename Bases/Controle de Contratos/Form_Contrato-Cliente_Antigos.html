    <title>Registro de Vendas Novo</title>
    <style>
        body {
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .form {
            background-color: #15172b;
            border-radius: 20px;
            box-sizing: border-box;
            padding: 20px;
            width: 85%;
            max-height: 90%;
            overflow-y: auto;
        }
        .title {
            color: #eee;
            font-family: sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-top: 30px;
            text-align: center;
        }
        .input-container {
            height: 50px;
            position: relative;
            width: 100%;
            margin-top: 20px;
        }
        .input {
            background-color: #303245;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            font-size: 18px;
            height: 100%;
            outline: 0;
            padding: 4px 20px 0;
            width: 100%;
        }
        .cut {
            background-color: #15172b;
            border-radius: 10px;
            height: 20px;
            left: 20px;
            position: absolute;
            top: -20px;
            transform: translateY(0);
            transition: transform 200ms;
            width: 170px;
        }
        .cut-short {
            width: 70px;
        }
        .input:focus ~ .cut,
        .input:not(:placeholder-shown) ~ .cut {
            transform: translateY(8px);
        }
        .placeholder {
            color: #65657b;
            font-family: sans-serif;
            left: 20px;
            line-height: 14px;
            pointer-events: none;
            position: absolute;
            transform-origin: 0 50%;
            transition: transform 200ms, color 200ms;
            top: 20px;
        }
        .input:focus ~ .placeholder,
        .input:not(:placeholder-shown) ~ .placeholder {
            transform: translateY(-30px) translateX(10px) scale(0.75);
        }
        .input:not(:placeholder-shown) ~ .placeholder {
            color: #808097;
        }
        .input:focus ~ .placeholder {
            color: #dc2f55;
        }
        .submit {
            background-color: #08d;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            cursor: pointer;
            font-size: 18px;
            height: 50px;
            margin-top: 38px;
            text-align: center;
            width: 100%;
        }
        .submit:active {
            background-color: #06b;
        }
        .btn-primary {
            background-color: #08d;
            border-radius: 12px;
            border: 0;
            color: #eee;
            cursor: pointer;
            font-size: 18px;
            height: 50px;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #06b;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }
        .checkbox-container input {
            width: auto;
            margin-right: 10px;
        }
        .checkbox-container label {
            color: #eee;
            font-size: 18px;
        }
        h2 {
            color: #eee; /* Cor branca */
            font-family: sans-serif; /* Fonte */
            font-size: 24px; /* Tamanho da fonte */
            margin-top: 20px; /* Espaçamento superior */
            text-align: center; /* Centraliza o texto */
            font-style: italic; /* Coloca o texto em itálico */
        }

        .linha {
            border-bottom: 2px solid #eee; /* Cor e espessura da linha */
            width: 100%; /* Largura total */
            margin-top: 10px; /* Espaçamento superior */
            margin-bottom: 20px; /* Espaçamento inferior */
        }

    </style>
</head>

    <!-- CPF Comprador 15 -->
    <div class="input-container">
        <input type="text" id="cpfClienteComprador15" name="cpfClienteComprador15" class="input" placeholder=" " required>
        <div class="cut"></div>
        <label for="cpfClienteComprador15" class="placeholder">CPF Cliente Comprador 15</label>
    </div>

    <h2>Botões de Ação</h2>
    <div class="linha"></div>

    <!-- Botões de Envio e Menu Principal -->
    <button type="button" class="submit" id="submitBtn">Enviar para a planilha</button>
    <button type="button" class="btn-primary" onclick="google.script.run.showMainMenu()">Menu Principal</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Popula o dropdown de contratos ao carregar a página
    google.script.run.withSuccessHandler(function(contracts) {
        var contratoDropdown = document.getElementById('contrato');
        contratoDropdown.innerHTML = '<option value="">Selecione o Contrato</option>';
        contracts.forEach(function(contract) {
            var option = document.createElement('option');
            option.value = JSON.stringify({ row: contract.row, idContrato: contract.idContrato });
            option.text = contract.contract;
            contratoDropdown.add(option);
        });
    }).getContractsAntigosAntigo();

    // Adiciona o evento ao botão de envio
    document.getElementById('submitBtn').addEventListener('click', enviarFormularioAntigo);
});

// Função para enviar formulário e arquivos
function enviarFormularioAntigo() {
    const formElement = document.getElementById('formVendas');
    const formData = new FormData(formElement);
    const selectedContract = document.getElementById('contrato').value;

    if (!selectedContract) {
        alert('Por favor, selecione um contrato válido.');
        return;
    }

    const contractData = JSON.parse(selectedContract);
    const row = contractData.row;
    const idContrato = contractData.idContrato;

    if (!row || !idContrato) {
        alert('Contrato ou linha inválidos.');
        return;
    }

    let files = [];
    formData.forEach((value, key) => {
        if (value instanceof File && value.type === 'application/pdf') {
            files.push(value);
        }
    });

    if (files.length === 0) {
        alert('É necessário enviar pelo menos um arquivo PDF.');
        return;
    }

    if (files.length > 2) {
        alert('Por favor, envie no máximo dois arquivos PDF.');
        return;
    }

    // Trata a concatenação de arquivos PDF se houver mais de um arquivo
    if (files.length === 2) {
        mergePDFsAntigo(files[0], files[1], function (mergedFile) {
            enviarDadosGoogleScriptAntigo(formData, mergedFile, row, idContrato);
        });
    } else {
        const reader = new FileReader();
        reader.onload = function (e) {
            const fileData = {
                name: files[0].name,
                mimeType: files[0].type,
                bytes: [...new Uint8Array(e.target.result)]
            };
            enviarDadosGoogleScriptAntigo(formData, fileData, row, idContrato);
        };
        reader.readAsArrayBuffer(files[0]);
    }
}

// Função para mesclar dois PDFs usando PDF-Lib
function mergePDFsAntigo(file1, file2, callback) {
    const reader1 = new FileReader();
    const reader2 = new FileReader();

    reader1.readAsArrayBuffer(file1);
    reader2.readAsArrayBuffer(file2);

    reader1.onload = function (e1) {
        reader2.onload = function (e2) {
            PDFLib.PDFDocument.create().then(async (mergedPdf) => {
                const [pdfDoc1, pdfDoc2] = await Promise.all([
                    PDFLib.PDFDocument.load(new Uint8Array(e1.target.result)),
                    PDFLib.PDFDocument.load(new Uint8Array(e2.target.result))
                ]);

                const copiedPages1 = await mergedPdf.copyPages(pdfDoc1, pdfDoc1.getPageIndices());
                copiedPages1.forEach(page => mergedPdf.addPage(page));
                const copiedPages2 = await mergedPdf.copyPages(pdfDoc2, pdfDoc2.getPageIndices());
                copiedPages2.forEach(page => mergedPdf.addPage(page));

                const mergedPdfBytes = await mergedPdf.save();
                callback({
                    name: 'merged_' + file1.name + '_' + file2.name,
                    mimeType: 'application/pdf',
                    bytes: [...new Uint8Array(mergedPdfBytes)]
                });
            });
        };
    };
}

// Envia os dados e o arquivo PDF para o Google Apps Script
function enviarDadosGoogleScriptAntigo(formData, fileData, row, idContrato) {
    google.script.run
        .withSuccessHandler(function(response) {
            alert('Dados e arquivo PDF enviados com sucesso. Resposta: ' + response);
        })
        .withFailureHandler(function(error) {
            alert('Erro ao enviar o formulário: ' + error.message);
        })
        .submitDataAntigo(JSON.stringify(Object.fromEntries(formData)), fileData, row, idContrato);
}
</script>
